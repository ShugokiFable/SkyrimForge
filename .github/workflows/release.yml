name: Release
on:
  push:
    tags: ["v*"]
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with: {persist-credentials: false}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with: {python-version: "3.13"}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version-file: writer/native-go/go.mod, cache: false}
      - name: Verify tag matches package version
        run: |
          VERSION=$(python -c "from skyrim_forge.version import VERSION; print(VERSION)")
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - run: python scripts/validate_repository.py --write-reports
      - run: |
          mkdir -p dist
          python scripts/build_release_archive.py "dist/Skyrim-Forge-${GITHUB_REF_NAME#v}.zip"
          python -c "import forge_build_backend; forge_build_backend.build_wheel('dist'); forge_build_backend.build_sdist('dist')"
          cp VALIDATION.json BUILD-RECEIPT.json MANIFEST.json SBOM.spdx.json dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: release-assets, path: dist/, if-no-files-found: error}
      - name: Publish release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
