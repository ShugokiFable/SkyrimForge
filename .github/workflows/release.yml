name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.2"
          cache: false
      - name: Verify tag and toolchain
        run: |
          VERSION=$(python -c "from skyrim_forge.version import VERSION; print(VERSION)")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$(go env GOVERSION)" = "go1.23.2"
          chmod +x writer/published/linux-x64/SkyrimForge.Native skyrim_forge/bin/linux-x64/SkyrimForge.Native
      - name: Full publication validation
        run: python scripts/validate_repository.py --scope full --write-reports
      - name: Build release assets
        run: |
          mkdir -p dist
          python scripts/build_release_archive.py "dist/Skyrim-Forge-${GITHUB_REF_NAME#v}.zip"
          python -c "import forge_build_backend; forge_build_backend.build_wheel('dist'); forge_build_backend.build_sdist('dist')"
          cp VALIDATION.json BUILD-RECEIPT.json MANIFEST.json SBOM.spdx.json dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
