name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Python, packaging, and MCP validation
        run: python scripts/validate_repository.py --scope python

  native:
    name: Native writer on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: writer/native-go
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.2"
          cache: false
      - name: Verify Go toolchain
        shell: bash
        run: test "$(go env GOVERSION)" = "go1.23.2"
      - name: Formatting
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...

  repository-validation:
    name: Reproducible repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.2"
          cache: false
      - name: Verify pinned toolchain
        run: |
          python --version
          test "$(go env GOVERSION)" = "go1.23.2"
      - name: Full publication validation
        run: |
          chmod +x writer/published/linux-x64/SkyrimForge.Native skyrim_forge/bin/linux-x64/SkyrimForge.Native
          python scripts/validate_repository.py --scope full

  windows-installer:
    name: Windows installer and legacy migration
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Select setup-python interpreter and config path
        shell: powershell
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $configPath = Join-Path $env:RUNNER_TEMP 'skyrim-forge\config.toml'
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SKYRIM_FORGE_PYTHON=$($env:pythonLocation)\python.exe`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SKYRIM_FORGE_CONFIG=$configPath`n", $utf8NoBom)
          & "$env:pythonLocation\python.exe" --version
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) {
              $failed = $true
              $parseErrors | ForEach-Object { Write-Error ("{0}:{1}: {2}" -f $_.Extent.File, $_.Extent.StartLineNumber, $_.Message) }
            }
          }
          if ($failed) { exit 1 }
      - name: Create legacy Papyrus configuration
        shell: powershell
        run: |
          $configRoot = Split-Path -Parent $env:SKYRIM_FORGE_CONFIG
          New-Item -ItemType Directory -Force -Path $configRoot | Out-Null
          $workspace = (Join-Path $env:RUNNER_TEMP 'Forge Workspaces').Replace('\', '/')
          $legacy = @"
          [paths]
          workspace_root = "$workspace"
          skyrim_data = ""

          [papyrus]
          compiler = "C:/Legacy/PapyrusCompiler.exe"
          flags = "C:/Legacy/TESV_Papyrus_Flags.flg"
          imports = ["C:/Legacy/Source"]

          [safety]
          allow_external_processes = false
          require_approval_for_writes = true
          "@
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($env:SKYRIM_FORGE_CONFIG, $legacy, $utf8NoBom)
      - name: Install, migrate, and reinstall
        shell: powershell
        run: |
          ./Install-or-Update.ps1
          $backup = "${env:SKYRIM_FORGE_CONFIG}.pre-3.0.1.bak"
          if (-not (Test-Path -LiteralPath $backup -PathType Leaf)) { throw "Legacy config backup was not created: $backup" }
          $migrated = Get-Content -LiteralPath $env:SKYRIM_FORGE_CONFIG -Raw
          if ($migrated -notmatch '\[tools\.papyrus_compiler\]') { throw 'Papyrus compiler was not migrated.' }
          if ($migrated -match '(?m)^compiler\s*=') { throw 'Legacy papyrus.compiler survived canonical migration.' }
          ./Install-or-Update.ps1
      - name: Verify installed runtime
        shell: powershell
        run: |
          $version = (& ./writer/published/win-x64/SkyrimForge.Native.exe version | Out-String).Trim()
          if ($version -ne 'SkyrimForge.Native 3.0.2 go') { throw "Unexpected native version: $version" }
          ./writer/published/win-x64/SkyrimForge.Native.exe self-test
          $doctor = ./.venv/Scripts/python.exe -m skyrim_forge doctor | ConvertFrom-Json
          if ($doctor.result -ne 'PASS') { throw ('Doctor failed: ' + ($doctor | ConvertTo-Json -Depth 20)) }
          if (-not $doctor.read_only_ready) { throw 'Forge is not read-only ready after installation.' }
