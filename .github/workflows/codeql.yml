name: CodeQL
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "23 4 * * 1"}]
permissions: {contents: read, security-events: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy: {matrix: {language: [python, go]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        with: {languages: "${{ matrix.language }}"}
      - if: matrix.language == 'go'
        working-directory: writer/native-go
        run: go build ./...
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
