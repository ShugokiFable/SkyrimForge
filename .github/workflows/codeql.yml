name: CodeQL
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "23 4 * * 1"}]
permissions: {contents: read, security-events: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy: {matrix: {language: [python, go]}}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        with: {languages: "${{ matrix.language }}"}
      - if: matrix.language == 'go'
        working-directory: writer/native-go
        run: go build ./...
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
